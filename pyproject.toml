[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-mapmatch"
version = "1.0.0"
description = "Reproducible directed-road map matching for noisy GPS trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
report = ["matplotlib>=3.8", "folium>=0.16", "reportlab>=4.0", "pillow>=10"]
dev = ["httpx>=0.27", "playwright>=1.45"]

[project.scripts]
mapmatch = "mapmatch.cli:main"

[tool.setuptools.packages.find]
include = ["mapmatch*", "backend*"]
