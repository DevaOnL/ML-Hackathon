services:
  pathsnap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${PATHSNAP_PORT:-8000}:8000"
    environment:
      PATHSNAP_DATASET_ROLE: "${PATHSNAP_DATASET_ROLE:-development}"
      PATHSNAP_CORS_ORIGINS: "${PATHSNAP_CORS_ORIGINS:-}"
      PATHSNAP_INFERENCE_CONCURRENCY: "1"
    volumes:
      - type: bind
        source: "${PATHSNAP_HOST_DATA_DIR:?Set the absolute input dataset path}"
        target: /data
        read_only: true
      - type: bind
        source: "${PATHSNAP_HOST_REFERENCE_DIR:?Set the absolute server-private reference path}"
        target: /references
        read_only: true
      - type: bind
        source: "${PATHSNAP_HOST_ARTIFACTS:?Set the absolute trained artifacts path}"
        target: /artifacts
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: unless-stopped
